# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Base URL (used for generating QR codes)
campuspulse.app.base-url=${APP_BASE_URL:http://localhost:8080}

# Persistent File-Based H2 Database (never in-memory)
spring.datasource.url=jdbc:h2:file:./data/campuspulse;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled in production, enabled locally for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Static Resource Mapping - Serves frontend and uploaded files directly
spring.web.resources.static-locations=classpath:/static/,file:frontend/,file:../frontend/,file:backend/uploads/,file:uploads/

# Multipart File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT Authentication
campuspulse.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
campuspulse.jwt.expiration-ms=86400000

# AI Configuration (Claude / Gemini with Deterministic Local Fallback)
campuspulse.ai.provider=${AI_PROVIDER:fallback}
campuspulse.ai.gemini.api-key=${GEMINI_API_KEY:}
campuspulse.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
campuspulse.ai.claude.api-key=${CLAUDE_API_KEY:}
campuspulse.ai.claude.model=${CLAUDE_MODEL:claude-3-haiku-20240307}
campuspulse.ai.timeout-ms=3500

# Logging
logging.level.com.campuspulse=INFO
logging.level.org.springframework.security=WARN
